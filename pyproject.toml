[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "latent-biclustering"
version = "0.1.0"
description = "Latent biclustering with joint object-attribute embeddings and structured interaction learning."
requires-python = ">=3.8"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "torch>=2.0",
  "torch-geometric>=2.3",
  "tqdm>=4.65",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["latent_biclustering*"]
